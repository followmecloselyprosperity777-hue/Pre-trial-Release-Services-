<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="PocketBolt - send and request money instantly (test mode prototype).">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PocketBolt">
  <title>PocketBolt</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="testbar" role="note">⚡ TEST MODE · simulated money only · no real charges</div>
  <main id="app" aria-live="polite"></main>
  <nav id="tabs" class="tabs hidden" aria-label="Main">
    <a href="#home" data-tab="home"><span class="ti">🏠</span><span>Home</span></a>
    <a href="#pay" data-tab="pay"><span class="ti">⚡</span><span>Pay</span></a>
    <a href="#activity" data-tab="activity"><span class="ti">🕑</span><span>Activity</span><i id="badge" class="badge hidden"></i></a>
    <a href="#cards" data-tab="cards"><span class="ti">💳</span><span>Cards</span></a>
    <a href="#profile" data-tab="profile"><span class="ti">👤</span><span>Profile</span></a>
  </nav>
  <div id="sheet-backdrop" class="backdrop hidden"></div>
  <section id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></section>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
